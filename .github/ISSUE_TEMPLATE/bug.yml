name: Bug
description: Report incorrect CityPulse behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide deterministic reproduction steps.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Users, domains, data, security, or operations affected.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, request IDs, screenshots, traces, or other useful evidence.